name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*' # Срабатывает при создании любого тега, начинающегося с v (например, v0.1.0)

permissions:
  contents: write # Нужно, чтобы GitHub Actions мог создавать релиз и загружать туда .exe

jobs:
  build-windows:
    name: Build setupercent.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create GitHub Release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/setupercent.exe
          generate_release_notes: true # Автоматически соберет список коммитов в описание релиза
