[package]
name = "setupercent"
version = "1.1.1"
edition = "2024"
description = "Minimalist Windows tray utility showing battery percentage for wireless mice, headphones, and keyboards"
license = "MIT"
repository = "https://github.com/jocray/setupercent"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
] }
winrt-notification = "0.5"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"